<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Transparent background -->

  <defs>
    <!-- Sharp contrast drop glow -->
    <filter id="clean-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ISOLATED EMBLEM / MARK -->
  <g fill="#ffffff" filter="url(#clean-glow)">
    
    <!-- 1. The Crown -->
    <!-- Center Peak: (250, 70), Left Peak: (170, 80), Right Peak: (330, 80) -->
    <!-- Base joins the top of the clipper blade structure -->
    <path d="M 160 80 
             L 190 145 
             L 250 70 
             L 310 145 
             L 340 80 
             L 360 170 
             L 140 170 
             Z"/>

    <!-- 2. Clipper Blade Gap / Teeth Grid -->
    <rect x="160" y="182" width="10" height="24" rx="3"/>
    <rect x="178" y="182" width="10" height="24" rx="3"/>
    <rect x="196" y="182" width="10" height="24" rx="3"/>
    <rect x="214" y="182" width="10" height="24" rx="3"/>
    <rect x="232" y="182" width="10" height="24" rx="3"/>
    <rect x="250" y="182" width="10" height="24" rx="3"/>
    <rect x="268" y="182" width="10" height="24" rx="3"/>
    <rect x="286" y="182" width="10" height="24" rx="3"/>
    <rect x="304" y="182" width="10" height="24" rx="3"/>
    <rect x="322" y="182" width="10" height="24" rx="3"/>

    <!-- 3. Clipper Main Body / Grip Profile -->
    <path d="M 155 218
             Q 175 295 185 365
             Q 190 395 220 400
             L 280 400
             Q 310 395 315 365
             Q 325 295 345 218
             Z"/>

    <!-- 4. Cord / Base Hanger Accent -->
    <rect x="235" y="410" width="30" height="12" rx="6"/>
  </g>
</svg>
